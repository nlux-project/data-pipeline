[project]
name = "nlux-data-pipeline"
version = "0.1.0"
description = "NLUX Data Pipeline for Cultural Heritage Collections Discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "cromulent>=1.0.1",
    "requests>=2.31.0",
    "requests-toolbelt>=1.0.0",
    "ujson>=5.10.0",
    "SPARQLWrapper>=2.0.0",
    "dateutils",
    "edtf>=1.1.5",
    "dateparser>=1.1.8",
    "shapely>=2.0.0",
    "lxml>=5.0.0",
    "jsonschema>=4.23.0",
    "lmdbm>=0.0.6",
    "sqlitedict>=2.0.0",
    "numpy>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "pyluach>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "coverage>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "pipeline",
    "pipeline.process",
    "pipeline.sources",
    "pipeline.storage",
    "backend",
    "backend.app",
]
